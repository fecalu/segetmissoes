name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag ou commit a publicar"
        required: true
        default: "main"

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "
            set -e
            cd '${VPS_APP_DIR:-/opt/segetmissoes}'
            git fetch --all --prune
            git checkout '${DEPLOY_REF}'
            git pull --ff-only || true
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build
            docker image prune -f
            docker compose -f docker-compose.prod.yml --env-file .env ps
          "
