name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag ou commit a publicar"
        required: true
        default: "main"

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          printf -v remote_command 'bash -s -- %q %q' "${VPS_APP_DIR:-/opt/segetmissoes}" "$DEPLOY_REF"
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "$remote_command" <<'REMOTE'
            set -euo pipefail
            cd "$1"
            requested_ref="$2"
            test -z "$(git status --porcelain)" || { echo 'Deploy recusado: checkout da VPS possui alteracoes locais.'; exit 1; }
            git fetch origin --prune
            if git show-ref --verify --quiet "refs/remotes/origin/$requested_ref"; then
              requested_ref="refs/remotes/origin/$requested_ref"
            fi
            target_commit=$(git rev-parse --verify --end-of-options "${requested_ref}^{commit}")
            if ! git merge-base --is-ancestor HEAD "$target_commit"; then
              echo 'Deploy recusado: a versao solicitada nao contem todos os commits atualmente publicados.'
              exit 1
            fi
            git checkout --detach "$target_commit"
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build
            docker compose -f docker-compose.prod.yml --env-file .env ps
            printf 'Published commit: %s\n' "$target_commit"
          REMOTE
