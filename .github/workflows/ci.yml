name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend - Java 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: seget_perfis_test
          POSTGRES_USER: seget_test
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seget_test -d seget_perfis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RBAC_TEST_DB_URL: jdbc:postgresql://localhost:5432/seget_perfis_test
      RBAC_TEST_DB_USER: seget_test
      RBAC_TEST_DB_PASSWORD: isolated_test_only
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend
        run: mvn -B clean verify

  frontend:
    name: Frontend - Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-compose:
    name: Docker Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet
