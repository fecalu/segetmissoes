name: Bug
about: Registrar um erro ou comportamento inesperado
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Use este modelo quando algo que ja existia parou de funcionar ou esta funcionando errado.
  - type: input
    id: resumo
    attributes:
      label: Resumo
      description: Descreva o problema em uma frase curta.
      placeholder: Ex. Relatorio PDF falha quando nao existem missoes no dia
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      description: Liste o caminho para chegar no erro.
      placeholder: |
        1. Acessar area administrativa
        2. Abrir relatorios
        3. Selecionar data sem missoes
        4. Clicar em gerar PDF
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      placeholder: O que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: atual
    attributes:
      label: Resultado atual
      placeholder: O que aconteceu de errado?
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidencias
      description: Prints, logs, URLs, mensagens de erro ou contexto relevante.
    validations:
      required: false
