services:
  db:
    image: postgres:16
    container_name: frota_db
    environment:
      POSTGRES_DB: frota_db
      POSTGRES_USER: frota_user
      POSTGRES_PASSWORD: frota_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: frota_backend
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/frota_db
      DB_USERNAME: frota_user
      DB_PASSWORD: frota_pass
      JWT_SECRET: VGhpc0lzQVN1cGVyU2VjcmV0S2V5VGhhdE11c3RCZUF0TGVhc3QzMkJ5dGVz
      JWT_EXPIRATION_MS: 86400000
      UPLOAD_BASE_DIR: /uploads
      SERVER_ADDRESS: 0.0.0.0
      APP_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://192.168.*.*:4200,http://10.*.*.*:4200,http://172.*.*.*:4200
    volumes:
      - uploads_data:/uploads
    ports:
      - "8080:8080"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: frota_pgadmin
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@frota.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"

  frontend:
    build:
      context: ./frontend
    container_name: frota_frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
  uploads_data:
