databases:
  - name: seget-db
    databaseName: frota_db
    user: frota_user
    plan: free

services:
  - type: web
    name: seget-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    domains:
      - api.segetmissoes.com.br
    envVars:
      - key: DB_CONNECTION
        fromDatabase:
          name: seget-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: seget-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: seget-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: seget-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: seget-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,https://segetmissoes.com.br,https://www.segetmissoes.com.br
      - key: UPLOAD_BASE_DIR
        value: /tmp/uploads
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0

  - type: web
    name: seget-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: Dockerfile
    domains:
      - segetmissoes.com.br
    envVars:
      - key: API_ORIGIN
        value: https://api.segetmissoes.com.br
