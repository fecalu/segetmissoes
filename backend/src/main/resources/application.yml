server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:frota_db}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${PGUSER:frota_user}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:frota_pass}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: ${APP_TIMEZONE:America/Sao_Paulo}
  jackson:
    time-zone: ${APP_TIMEZONE:America/Sao_Paulo}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

security:
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5VGhhdE11c3RCZUF0TGVhc3QzMkJ5dGVz}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  legacy-time-fix:
    enabled: ${APP_LEGACY_TIME_FIX_ENABLED:false}
    hours-offset: ${APP_LEGACY_TIME_FIX_HOURS_OFFSET:-3}
  upload:
    base-dir: ${UPLOAD_BASE_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://192.168.*.*:4200,http://10.*.*.*:4200,http://172.*.*.*:4200,https://*.onrender.com,https://segetmissoes.com.br,https://www.segetmissoes.com.br}
