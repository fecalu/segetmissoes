server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/frota_db}
    username: ${DB_USERNAME:frota_user}
    password: ${DB_PASSWORD:frota_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

security:
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5VGhhdE11c3RCZUF0TGVhc3QzMkJ5dGVz}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  upload:
    base-dir: ${UPLOAD_BASE_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://192.168.*.*:4200,http://10.*.*.*:4200,http://172.*.*.*:4200}
