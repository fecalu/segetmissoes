name: segetmissoes

services:
  db:
    image: postgres:16-alpine
    container_name: seget_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - seget_pgdata:/var/lib/postgresql/data
    networks:
      - seget_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: seget_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      UPLOAD_BASE_DIR: /uploads
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    volumes:
      - seget_uploads:/uploads
    ports:
      - "127.0.0.1:${SEGET_BACKEND_PORT:-8092}:8080"
    networks:
      - seget_net

  frontend:
    build:
      context: ./frontend
    container_name: seget_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_ORIGIN: ${API_ORIGIN}
      UPLOAD_BASE_URL: ${API_ORIGIN}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${SEGET_FRONTEND_PORT:-4320}:80"
    networks:
      - seget_net

networks:
  seget_net:
    name: seget_net

volumes:
  seget_pgdata:
    name: seget_pgdata
  seget_uploads:
    name: seget_uploads
