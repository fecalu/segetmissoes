<section class="page-wrap password-page">
  <mat-card class="password-card">
    <p class="eyebrow">Primeiro acesso</p>
    <h1>Crie sua senha definitiva</h1>
    <p class="helper">Sua conta foi criada com uma senha temporária. Para continuar, informe uma nova senha.</p>

    <form [formGroup]="form" (ngSubmit)="salvar()">
      <mat-form-field appearance="outline">
        <mat-label>Nova senha</mat-label>
        <input matInput type="password" formControlName="novaSenha" autocomplete="new-password">
        <mat-error *ngIf="form.controls.novaSenha.invalid">Use pelo menos 8 caracteres.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirmar senha</mat-label>
        <input matInput type="password" formControlName="confirmarSenha" autocomplete="new-password">
      </mat-form-field>

      <p *ngIf="error" class="error" role="alert">{{ error }}</p>

      <button mat-flat-button color="primary" type="submit" [disabled]="loading">
        {{ loading ? 'Salvando...' : 'Salvar e continuar' }}
      </button>
    </form>
  </mat-card>
</section>
