<section class="page-wrap">
  <mat-card class="card-shell admin-login-card">
    <div class="hero">
      <p class="eyebrow">Area Administrativa</p>
      <h1>Gestao de Frota</h1>
      <p>Gerencie motoristas e acompanhe os checklists enviados em campo.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form" autocomplete="off">
      <h2>Entrar como administrador</h2>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Login</mat-label>
        <input matInput formControlName="login" autocomplete="off" autocapitalize="off" spellcheck="false">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="senha" autocomplete="new-password">
      </mat-form-field>

      <mat-checkbox color="primary" formControlName="lembrarAcesso" class="remember-option">
        Salvar login e senha neste aparelho
      </mat-checkbox>

      <button mat-flat-button color="primary" class="full-width" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
      <a routerLink="/login" class="back-link">Voltar para login do motorista</a>
    </form>
  </mat-card>
</section>
