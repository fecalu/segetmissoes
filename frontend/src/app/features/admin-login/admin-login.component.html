<section class="page-wrap">
  <mat-card class="card-shell admin-login-card">
    <div class="hero">
      <p class="eyebrow">Area Administrativa</p>
      <h1>Gestao de Frota</h1>
      <p>Gerencie motoristas e acompanhe os checklists enviados em campo.</p>
      <div class="cred-box">
        <small>Acesso admin</small>
        <strong>admin / admin123</strong>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <h2>Entrar como administrador</h2>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Login</mat-label>
        <input matInput formControlName="login" placeholder="admin">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="senha" placeholder="******">
      </mat-form-field>

      <button mat-flat-button color="primary" class="full-width" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
      <a routerLink="/login" class="back-link">Voltar para login do motorista</a>
    </form>
  </mat-card>
</section>
