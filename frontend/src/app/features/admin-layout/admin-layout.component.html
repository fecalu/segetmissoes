<a class="skip-link" href="#admin-content" (click)="skipToContent($event)">Ir para o conteúdo</a>
<div class="admin-workspace">
  <aside class="desktop-sidebar">
    <ng-container *ngTemplateOutlet="sidebar" />
  </aside>
  <div class="workspace-main">
    <header class="workspace-topbar">
      <div class="location">
        <button class="icon-button mobile-menu-toggle" type="button" aria-label="Abrir menu de navegação" aria-haspopup="dialog" (click)="openMenu()"><app-icon name="menu" /></button>
        <span class="location-root">Administração</span><span class="location-divider" aria-hidden="true">/</span>
        <span class="location-current">{{ pageLabel }}</span>
      </div>
      <span class="today">{{ today }}</span>
    </header>
    <main #content id="admin-content" tabindex="-1" class="workspace-content"><router-outlet /></main>
  </div>
</div>

<dialog #mobileMenu class="mobile-sidebar" aria-label="Menu de navegação" (click)="closeBackdrop($event)">
  <button class="icon-button close-menu" type="button" aria-label="Fechar menu" (click)="closeMenu()"><app-icon name="close" /></button>
  <ng-container *ngTemplateOutlet="sidebar" />
</dialog>

<ng-template #sidebar>
  <a class="brand" routerLink="/admin" [queryParams]="{menu: 'operacao'}" aria-label="SEGET, início da administração" (click)="closeMenu()">
    <span class="brand-symbol"><app-icon name="fleet" /></span>
    <span><strong>SEGET<span class="brand-dot">.</span></strong><small>Gestão de frota</small></span>
  </a>
  <nav class="side-navigation" aria-label="Navegação administrativa">
    <section class="nav-section" *ngFor="let section of navigationGroups">
      <p class="nav-caption">{{ section.label }}</p>
      <div class="nav-group" *ngFor="let item of section.items">
        <a *ngIf="!item.children" class="nav-item" [class.active]="activeId === item.id" [routerLink]="item.path" [queryParams]="item.menu ? {menu: item.menu} : {}" [attr.aria-current]="activeId === item.id ? 'page' : null" (click)="closeMenu()">
          <app-icon [name]="item.icon" /><span>{{ item.label }}</span>
          <span class="active-indicator" *ngIf="activeId === item.id" aria-hidden="true"></span>
        </a>
        <button *ngIf="item.children" class="nav-item" [class.active]="activeId === item.id" type="button" [attr.aria-expanded]="isExpanded(item)" (click)="toggleGroup(item)">
          <app-icon [name]="item.icon" /><span>{{ item.label }}</span><app-icon class="nav-chevron" [class.expanded]="isExpanded(item)" name="arrow" />
        </button>
        <div class="nav-children" *ngIf="item.children && isExpanded(item)">
          <a *ngFor="let child of item.children" [routerLink]="child.path" [queryParams]="{menu: child.menu}" [class.current]="isCurrent(child)" [attr.aria-current]="isCurrent(child) ? 'page' : null" (click)="closeMenu()">{{ child.label }}</a>
        </div>
      </div>
    </section>
  </nav>
  <footer class="sidebar-footer">
    <p class="institution">Serviços Gerais<br>e Transportes</p>
    <div class="account"><span class="avatar">{{ initials }}</span><span><strong>{{ auth.loggedName() || 'Administrador' }}</strong><small>{{ auth.perfilLabel }}</small></span></div>
    <button class="logout-button" type="button" (click)="auth.logout()"><app-icon name="logout" /> Sair do sistema</button>
  </footer>
</ng-template>
